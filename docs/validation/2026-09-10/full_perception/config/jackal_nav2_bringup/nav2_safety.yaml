nav2_safety_guard:
  ros__parameters:
    # Collision Monitor polygons are derived from these same values at launch.
    base_frame: base_link
    odom_frame: odom
    map_frame: map
    min_height: 0.10
    max_height: 1.80
    footprint_half_x: 0.254
    footprint_half_y: 0.215
    stop_half_x: 0.60
    stop_half_y: 0.50
    slow_half_x: 1.00
    slow_half_y: 0.80
    min_points: 3
    slowdown_ratio: 0.30
    sensor_timeout: 0.30
    command_timeout: 0.25
    future_tolerance: 0.05
    tf_timeout: 0.30
    map_tf_timeout: 0.50
    map_transform_tolerance: 1.0
    max_linear_x: 0.20
    max_angular_z: 0.35
